  <head>

    <meta
      name="description"
      content="Makes labelled source thumbnails for a Barco Eventmaster or Analog Way RCS2 multiviewer, a whole rig at once, one image per source in a ZIP. Free, and it runs in the browser."
    />
    <title>Thumbnail Generator — Every source's thumbnail, built from the patch list</title>
    <link rel="canonical" href="https://thumbnail-generator.stoatworks-labs.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Stoatworks Labs">
    <meta property="og:locale" content="en_GB">
    <meta property="og:url" content="https://thumbnail-generator.stoatworks-labs.com/">
    <meta property="og:title" content="Thumbnail Generator — Every source's thumbnail, built from the patch list">
    <meta property="og:description" content="Makes labelled source thumbnails for a Barco Eventmaster or Analog Way RCS2 multiviewer, a whole rig at once, one image per source in a ZIP. Free, and it runs in the browser.">
    <!-- Card hosted on the main site: it is regenerated in place by the
         website's make_thumbnails.py and keeps its filename, so a copy
         vendored here would go stale without anything saying so. It does not
         exist until this project is added to the website's projects.json. -->
    <meta property="og:image" content="https://stoatworks-labs.com/thumbs/thumbnail-generator.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="720">
    <meta property="og:image:alt" content="Thumbnail Generator">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://stoatworks-labs.com/thumbs/thumbnail-generator.png">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "@id": "https://thumbnail-generator.stoatworks-labs.com#app",
        "name": "Thumbnail Generator",
        "url": "https://thumbnail-generator.stoatworks-labs.com",
        "description": "Makes labelled source thumbnails for a Barco Eventmaster or Analog Way RCS2 multiviewer, a whole rig at once, one image per source in a ZIP. Free, and it runs in the browser.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any (runs in a web browser)",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "GBP"
        },
        "author": {
          "@id": "https://stoatworks-labs.com/#organization",
          "@type": "Organization",
          "name": "Stoatworks Labs",
          "url": "https://stoatworks-labs.com/"
        },
        "publisher": {
          "@id": "https://stoatworks-labs.com/#organization"
        },

          "https://stoatworks-labs.com/web-tools/thumbnail-generator/",
          "https://github.com/stoatworks-labs/thumbnail-generator"
        ]
      }
    </script>
      <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons and wants a PNG of its own. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Tints the status bar when installed. Two, so it follows the theme. -->
    <meta name="theme-color" content="#12151b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12151b" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <noscript>
      <h1>Thumbnail Generator</h1>
      <p>Builds the labelled source thumbnails an Eventmaster or an RCS2 shows on its multiviewer, for a whole rig at once. Type or paste the source list, give each one an icon, a size and a colour, and download a ZIP with one image per source, named after it, plus a manifest matching each file to its source. It all runs in the browser.</p>
      <p>It needs JavaScript to run.</p>
      <ul>
        <li><a href="https://stoatworks-labs.com/web-tools/thumbnail-generator/">Thumbnail Generator on Stoatworks Labs</a></li>
        <li><a href="https://stoatworks-labs.com/software/thumbnail-generator/">Project page</a></li>
        <li><a href="https://stoatworks-labs.com/software/thumbnail-generator/guide/">User guide</a></li>
        <li><a href="https://github.com/stoatworks-labs/thumbnail-generator">Source code on GitHub</a></li>
      </ul>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here. Classic +
      defer like the support footer: about-data.js only sets defaults, so it and
      the app's own startup can load in either order.
    -->
    <script src="/about-data.js" defer></script>
    <script src="/about.js" defer></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run that repo's scripts/sync-support-footer.sh, never here.
      Classic + defer on purpose: it reads its config off this tag, and
      document.currentScript is null inside a module.

      No data-repo, and none is needed: the repo and licence reach the footer
      and the About dialog through about-data.js, which sync-about.py generates
      from the website's projects.json. That was empty while this repo was
      private and filled itself in when it went public — which is the point of
      generating it rather than hardcoding a link here that would have 404'd.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="Thumbnail Generator"
      data-repo="https://github.com/stoatworks-labs/thumbnail-generator"
      data-note="It runs entirely in your browser — no account, and no source list you build is uploaded."
    ></script>
  </body>
</html>
